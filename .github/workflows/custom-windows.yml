name: LearnHarness Custom Windows Build

on:
  workflow_dispatch:
    inputs:
      copilot_student:
        description: "Include experimental Copilot Student fix PR 223"
        type: boolean
        required: true
        default: false
      release_tag:
        description: "Optional GitHub release tag to publish automatically (e.g. chronoharness-0.6.1-r7)"
        type: string
        required: false
        default: ""
      release_title:
        description: "Optional GitHub release title"
        type: string
        required: false
        default: ""
      release_notes:
        description: "Optional GitHub release summary markdown"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare plugins
        run: npm run plugins:setup

      - name: Apply Copilot Student patch (optional)
        if: ${{ inputs.copilot_student }}
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/amosblomqvist/learnharness/commit/6c92c4c006bafcd628dbfed1f16f69ef6501b5db.patch" `
            -OutFile "copilot-student.patch"

          if ((Get-FileHash copilot-student.patch -Algorithm SHA256).Hash.ToLower() -ne "d0e2367e1ef772473cbb87b97b088c1c8b13cb9e3fdee390afb8c36672d2903f") {
            throw "Copilot patch checksum mismatch"
          }

          git apply --check --exclude="tests/subscription-stream.test.ts" copilot-student.patch
          if ($LASTEXITCODE -ne 0) {
            throw "Copilot patch still has conflicts"
          }

          git apply --exclude="tests/subscription-stream.test.ts" copilot-student.patch
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to apply Copilot patch"
          }

          Remove-Item copilot-student.patch
          git diff --stat

      - name: Test optional Copilot Auto patch
        if: ${{ inputs.copilot_student }}
        env:
          NODE_ENV: test
          LH_TEST_COPILOT_AUTO: "1"
        run: |
          node --import=tsx --test --test-name-pattern="Auto" tests/subscription-auth.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import=tsx --test tests/subscription-stream.test.ts

      - name: Test recall and Google stream changes
        env:
          NODE_ENV: test
        run: node --import=tsx --test tests/google-stream-tail.test.ts tests/recall-fsrs.test.ts tests/recall-fsrs-ui.test.tsx tests/recall-insights.test.ts tests/recall-groups.test.ts tests/recall-analysis-ui.test.tsx

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run Windows native tests
        env:
          NODE_ENV: test
        run: node --import=tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts

      - name: Build LearnHarness
        run: npm run build

      - name: Test model provider runtime
        run: node scripts/smoke-provider-runtime.mjs

      - name: Package application server
        run: node scripts/build-server.mjs

      - name: Verify Google stream fix in packaged server
        shell: pwsh
        run: |
          $sdk = ".next/standalone/node_modules/@google/genai/dist/node/index.mjs"
          if (!(Test-Path -LiteralPath $sdk) -or !(Select-String -Quiet -LiteralPath $sdk -SimpleMatch "LearnHarness: only accept an undelimited")) {
            throw "Packaged Google SDK is missing the verified stream fix"
          }

      - name: Test Electron server
        run: node scripts/smoke-server.mjs --electron

      - name: Create Windows installer
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LearnHarness-Custom-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub Release (optional)
        if: ${{ inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer .exe found in dist/" }
          $sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $title = if ($env:RELEASE_TITLE) { $env:RELEASE_TITLE } else { "ChronoHarness ($env:RELEASE_TAG)" }
          $summary = if ($env:RELEASE_NOTES) { $env:RELEASE_NOTES } else { "Built cleanly from commit ``$shortSha``." }
          $lines = @(
            $summary,
            "",
            "#### Verification",
            "- File: ``$($exe.Name)``",
            "- Size: ``$($exe.Length)`` bytes",
            "- SHA256: ``$sha256``"
          )
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesFile -Value ($lines -join "`n") -Encoding utf8
          gh release create $env:RELEASE_TAG $exe.FullName --target $env:GITHUB_SHA --title $title --notes-file $notesFile --latest
